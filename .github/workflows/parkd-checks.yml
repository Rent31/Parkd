name: Parkd checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev
      - name: Experimental erasure codec unit tests
        run: |
          set -o pipefail
          cargo test --locked -p garage_block --features experimental-ec --lib 2>&1 | tee "$RUNNER_TEMP/parkd-rust-tests.log"
      - name: S3 unit tests
        run: |
          set -o pipefail
          cargo test --locked -p garage_api_s3 --features garage_model/sqlite --lib 2>&1 | tee "$RUNNER_TEMP/parkd-rust-tests.log"
      - name: Common API unit tests
        run: |
          set -o pipefail
          cargo test --locked -p garage_api_common --features garage_model/sqlite --lib 2>&1 | tee "$RUNNER_TEMP/parkd-rust-tests.log"
      - name: Integration tests
        run: |
          set -o pipefail
          cargo test --locked -p garage --test integration 2>&1 | tee "$RUNNER_TEMP/parkd-rust-tests.log"
      - name: Report test failure
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'parkd-rust-tests.log'
          if path.exists():
              data = path.read_text(errors='replace')[-2800:]
              data = data.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + data)
          PYCODE
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/api/admin/console/package-lock.json
      - name: Test local setup
        run: ./script/test-parkd-setup.sh
      - name: Test console
        working-directory: src/api/admin/console
        run: npm ci && npm test
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Prometheus tools
        run: sudo apt-get update && sudo apt-get install -y prometheus
      - name: Check alert rules
        working-directory: script/telemetry
        run: |
          promtool check rules parkd-alerts.yml
          promtool test rules parkd-alerts.test.yml
